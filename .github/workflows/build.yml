name: Build Permanent Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIPFILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

          if [ -z "$ZIPFILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found ZIP: $ZIPFILE"
          rm -rf extracted
          mkdir -p extracted
          unzip -o "$ZIPFILE" -d extracted

      - name: Find project root
        id: findroot
        run: |
          BUILD_FILE=$(find extracted -maxdepth 5 \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "Found project at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Permanent keystore from GitHub Secret
      - name: Restore Permanent Keystore
        working-directory: ${{ steps.findroot.outputs.project_dir }}
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > xflow-release.jks

          if [ ! -s xflow-release.jks ]; then
            echo "ERROR: Permanent keystore could not be restored"
            exit 1
          fi

          echo "Permanent keystore restored successfully"

      # Project requires debug.keystore during assembleDebug
      - name: Generate Debug Keystore
        working-directory: ${{ steps.findroot.outputs.project_dir }}
        run: |
          rm -f debug.keystore

          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "Debug keystore generated successfully"

      - name: Build Debug APK
        working-directory: ${{ steps.findroot.outputs.project_dir }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        id: findapk
        working-directory: ${{ steps.findroot.outputs.project_dir }}
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" \
            -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "Found APK: $APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # Get Android build-tools for apksigner
      - name: Find APK Signer
        id: signer
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          echo "Using: $APKSIGNER"
          echo "apksigner=$APKSIGNER" >> "$GITHUB_OUTPUT"

      # Replace debug signature with permanent release signature
      - name: Sign APK With Permanent Key
        working-directory: ${{ steps.findroot.outputs.project_dir }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APKSIGNER: ${{ steps.signer.outputs.apksigner }}
          APK: ${{ steps.findapk.outputs.apk }}
        run: |
          "$APKSIGNER" sign \
            --ks xflow-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out XFlow-signed.apk \
            "$APK"

          "$APKSIGNER" verify --verbose --print-certs XFlow-signed.apk

          echo "APK signed successfully"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: XFlow-Signed-APK
          path: ${{ steps.findroot.outputs.project_dir }}/XFlow-signed.apk
          if-no-files-found: error
          retention-days: 30
