name: Build Permanent Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          rm -rf extracted
          mkdir -p extracted

          ZIPFILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

          if [ -z "$ZIPFILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP found: $ZIPFILE"
          unzip -o "$ZIPFILE" -d extracted

      - name: Find project root
        id: findroot
        run: |
          BUILD_FILE=$(find extracted -maxdepth 4 -name "settings.gradle*" | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "Found project at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Permanent Keystore
        working-directory: ${{ steps.findroot.outputs.project_dir }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > xflow-release.jks

          if [ ! -s xflow-release.jks ]; then
            echo "ERROR: Permanent keystore restore failed"
            exit 1
          fi

          echo "Permanent keystore restored"

      - name: Build Debug APK
        working-directory: ${{ steps.findroot.outputs.project_dir }}
        run: gradle assembleDebug

      - name: Sign APK With Permanent Key
        working-directory: ${{ steps.findroot.outputs.project_dir }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK found: $APK"

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)

          "$BUILD_TOOLS/apksigner" sign \
            --ks xflow-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out XFlow-signed.apk \
            "$APK"

          "$BUILD_TOOLS/apksigner" verify --verbose XFlow-signed.apk

          echo "Permanent signed APK created successfully"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XFlow-Permanent-Signed
          path: ${{ steps.findroot.outputs.project_dir }}/XFlow-signed.apk
          if-no-files-found: error
