name: Build Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          rm -rf extracted
          mkdir -p extracted

          ZIPFILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIPFILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Using ZIP: $ZIPFILE"
          unzip -o "$ZIPFILE" -d extracted

      - name: Find Android project
        id: project
        run: |
          SETTINGS=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Permanent Signing Key
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > xflow-release.jks

          if [ ! -s xflow-release.jks ]; then
            echo "ERROR: Keystore could not be restored"
            exit 1
          fi

          echo "Permanent keystore restored successfully"

      - name: Build Release APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle assembleRelease

      - name: Find and Sign APK
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APK=$(find . -path "*/build/outputs/apk/release/*.apk" -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found"
            exit 1
          fi

          echo "APK found: $APK"

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)

          if [ -z "$BUILD_TOOLS" ]; then
            echo "ERROR: Android Build Tools not found"
            exit 1
          fi

          "$BUILD_TOOLS/apksigner" sign \
            --ks xflow-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out XFlow-signed.apk \
            "$APK"

          "$BUILD_TOOLS/apksigner" verify --verbose XFlow-signed.apk

          echo "APK signed successfully"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: XFlow-Signed-APK
          path: ${{ steps.project.outputs.dir }}/XFlow-signed.apk
          if-no-files-found: error
