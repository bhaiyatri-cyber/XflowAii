name: Build Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          rm -rf extracted
          mkdir extracted
          ZIPFILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

          if [ -z "$ZIPFILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          unzip -o "$ZIPFILE" -d extracted

      - name: Find Android project
        id: project
        run: |
          SETTINGS=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore permanent signing key
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > xflow-release.jks

      - name: Build Release APK
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign Release APK
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          if [ -z "$UNSIGNED_APK" ]; then
            echo "Release APK not found"
            exit 1
          fi

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)

          "$BUILD_TOOLS/apksigner" sign \
            --ks xflow-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out XFlow-signed.apk \
            "$UNSIGNED_APK"

          "$BUILD_TOOLS/apksigner" verify --verbose XFlow-signed.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: XFlow-Signed-APK
          path: ${{ steps.project.outputs.dir }}/XFlow-signed.apk
